name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee type-check.log

      - name: Run unit tests
        run: |
          set -o pipefail
          npm run test 2>&1 | tee unit-test.log

      - name: Run Firestore Security Rules tests
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-test.log

      - name: Build production assets
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-diagnostics
          path: |
            type-check.log
            unit-test.log
            rules-test.log
            build.log
          if-no-files-found: ignore
          retention-days: 7
