<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>トーラス・マンハッタン距離・指数可変デモ</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Yu Gothic UI",sans-serif;background:#f4f7fb;color:#172033}header{position:sticky;top:0;z-index:5;background:#172033;color:#fff;padding:10px 16px;display:flex;gap:18px;align-items:center}header a{color:#fff;text-decoration:none}main{max-width:1180px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #d8e0eb;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 8px 24px #23305a12}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.controls label{display:grid;gap:4px;font-size:12px}.controls input,.controls select,.controls button{font:inherit;padding:8px;border:1px solid #c8d2e1;border-radius:8px;background:#fff}.controls button{cursor:pointer;background:#3454d1;color:#fff;border:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stat{background:#eef3f9;border-radius:9px;padding:9px}.stat b{display:block;font-size:18px}.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs button{padding:8px 18px;border:1px solid #aebbd0;border-radius:999px;background:#fff}.tabs .active{background:#172033;color:#fff}.hint{color:#5c667a;font-size:13px}.viewport{height:min(70vh,650px);overflow:auto;border:2px solid #9eabc0;border-radius:12px;background:#e9eef6;scrollbar-gutter:stable}.world{position:relative;width:1800px;height:1800px}.tile{position:absolute;width:54px;height:54px;border:1px solid #b8c3d3;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;user-select:none}.tile:hover{outline:3px solid #f59e0b}.tile.neighbor{background:#2563eb;color:#fff;border-color:#1d4ed8}.tile.selected{background:#f97316;color:#fff;border-color:#ea580c}.marker{position:absolute;width:58px;height:58px;border:3px dashed #f97316;border-radius:50%;pointer-events:none}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}.busy{opacity:.55;pointer-events:none}@media(max-width:600px){main{padding:8px}.world{width:1500px;height:1500px}.tile{width:45px;height:45px}}
</style></head><body><header><a href="../">← トップ</a><a href="../algorithm.html">アルゴリズム詳説</a><strong>マンハッタン距離指数実験</strong></header><main>
<section class="panel"><div class="controls"><label>指数 p<select id="exp"></select></label><label>平均次数<input id="degree" type="number" min="1" max="30" value="6"></label><label>乱数シード<input id="seed" type="number" value="20260729"></label><label>反復回数<input id="iters" type="number" min="1" max="20" value="6"></label><button id="generate">グラフ再生成</button><button id="optimize">同じグラフを再最適化</button></div><p class="hint">目的関数は Σ w<sub>ab</sub>d<sub>M</sub><sup>p</sup>。d<sub>M</sub> は10×10トーラス上の上下左右の最短マス数です。</p></section>
<section class="panel stats"><div class="stat">集合<b id="side">A</b></div><div class="stat">辺数<b id="edges">-</b></div><div class="stat">平均 d<sub>M</sub><b id="avg">-</b></div><div class="stat">平均 d<sub>M</sub><sup>p</sup><b id="cost">-</b></div><div class="stat">最大距離<b id="max">-</b></div><div class="stat">選択頂点<b id="sel">なし</b></div></section>
<section class="panel"><div class="tabs"><button id="tabA" class="active">集合A</button><button id="tabB">集合B</button></div><div class="legend"><span><i class="dot" style="background:#f97316"></i>選択位置</span><span><i class="dot" style="background:#2563eb"></i>隣接頂点</span></div><p class="hint">ドラッグまたはスクロールして周期平面を移動できます。画面切替時もスクロール位置を維持します。</p><div id="view" class="viewport"><div id="world" class="world"></div></div></section>
</main><script>
'use strict';const N=100,W=10,H=10,CELL=60,PER=600,COPIES=3;const $=s=>document.querySelector(s);for(let i=10;i<=20;i++){let o=document.createElement('option');o.value=(i/10).toFixed(1);o.textContent=o.value;if(i===15)o.selected=true;$('#exp').append(o)}
let S={side:'A',adjA:[],adjB:[],posA:[],posB:[],baseA:[],baseB:[],selected:null,origin:null,edges:[]};function rng(seed){let x=seed|0;return()=>{x|=0;x=x+0x6D2B79F5|0;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function cells(){return Array.from({length:N},(_,i)=>({x:i%W,y:Math.floor(i/W)}))}function md(a,b){let dx=Math.abs(a.x-b.x),dy=Math.abs(a.y-b.y);return Math.min(dx,W-dx)+Math.min(dy,H-dy)}
function build(){let r=rng(+$('#seed').value||1),d=Math.max(1,Math.min(30,+$('#degree').value||6));S.adjA=Array.from({length:N},()=>new Set);S.adjB=Array.from({length:N},()=>new Set);for(let a=0;a<N;a++){let order=shuffle([...Array(N).keys()],r);for(let k=0;k<d;k++){let b=order[k];S.adjA[a].add(b);S.adjB[b].add(a)}}for(let b=0;b<N;b++)if(!S.adjB[b].size){let a=Math.floor(r()*N);S.adjA[a].add(b);S.adjB[b].add(a)}S.edges=[];for(let a=0;a<N;a++)for(let b of S.adjA[a])S.edges.push([a,b]);S.baseA=shuffle(cells(),r);S.baseB=shuffle(cells(),r);S.selected=null;S.origin=null;optimize()}
function weight(a,b){return .5/Math.max(1,S.adjA[a].size)+.5/Math.max(1,S.adjB[b].size)}function matrix(side,p){let fixed=side==='A'?S.posB:S.posA,adj=side==='A'?S.adjA:S.adjB,cs=cells(),m=[];for(let i=0;i<N;i++){m[i]=[];for(let s=0;s<N;s++){let q=cs[s],z=0;for(let j of adj[i]){let a=side==='A'?i:j,b=side==='A'?j:i;z+=weight(a,b)*Math.pow(md(q,fixed[j]),p)}m[i][s]=z+1e-9*s}}return m}
function hungarian(a){let n=a.length,m=a[0].length,u=Array(n+1).fill(0),v=Array(m+1).fill(0),p=Array(m+1).fill(0),way=Array(m+1).fill(0);for(let i=1;i<=n;i++){p[0]=i;let j0=0,min=Array(m+1).fill(Infinity),used=Array(m+1).fill(false);do{used[j0]=true;let i0=p[j0],delta=Infinity,j1=0;for(let j=1;j<=m;j++)if(!used[j]){let cur=a[i0-1][j-1]-u[i0]-v[j];if(cur<min[j])min[j]=cur,way[j]=j0;if(min[j]<delta)delta=min[j],j1=j}for(let j=0;j<=m;j++)used[j]?(u[p[j]]+=delta,v[j]-=delta):min[j]-=delta;j0=j1}while(p[j0]!==0);do{let j1=way[j0];p[j0]=p[j1];j0=j1}while(j0)}let ans=Array(n);for(let j=1;j<=m;j++)if(p[j])ans[p[j]-1]=j-1;return ans}
function assign(side,p){let cs=cells(),as=hungarian(matrix(side,p)),out=as.map(i=>cs[i]);if(side==='A')S.posA=out;else S.posB=out}function objective(p){let z=0,w=0,sum=0,mx=0;for(let [a,b] of S.edges){let d=md(S.posA[a],S.posB[b]),q=weight(a,b);z+=q*Math.pow(d,p);w+=q;sum+=d;mx=Math.max(mx,d)}return{cost:z/w,avg:sum/S.edges.length,max:mx}}
function optimize(){document.body.classList.add('busy');setTimeout(()=>{let p=+$('#exp').value,it=Math.max(1,Math.min(20,+$('#iters').value||6));S.posA=S.baseA.map(x=>({...x}));S.posB=S.baseB.map(x=>({...x}));for(let k=0;k<it;k++){assign('A',p);assign('B',p)}document.body.classList.remove('busy');render();},20)}
function render(){let world=$('#world');world.innerHTML='';let pos=S.side==='A'?S.posA:S.posB,neighbors=new Set;if(S.selected&&S.selected.side!==S.side){let ad=S.selected.side==='A'?S.adjA[S.selected.id]:S.adjB[S.selected.id];neighbors=new Set(ad)}for(let cy=0;cy<COPIES;cy++)for(let cx=0;cx<COPIES;cx++)for(let i=0;i<N;i++){let q=pos[i],el=document.createElement('button');el.className='tile'+(neighbors.has(i)?' neighbor':'')+(S.selected&&S.selected.side===S.side&&S.selected.id===i?' selected':'');el.textContent=S.side+(i+1).toString().padStart(3,'0');el.style.left=(cx*PER+q.x*CELL+3)+'px';el.style.top=(cy*PER+q.y*CELL+3)+'px';el.onclick=()=>pick(i);world.append(el)}if(S.origin){for(let cy=0;cy<COPIES;cy++)for(let cx=0;cx<COPIES;cx++){let m=document.createElement('div');m.className='marker';m.style.left=(cx*PER+S.origin.x*CELL+1)+'px';m.style.top=(cy*PER+S.origin.y*CELL+1)+'px';world.append(m)}}let o=objective(+$('#exp').value);$('#side').textContent=S.side;$('#edges').textContent=S.edges.length;$('#avg').textContent=o.avg.toFixed(3);$('#cost').textContent=o.cost.toFixed(3);$('#max').textContent=o.max;$('#sel').textContent=S.selected?S.selected.side+(S.selected.id+1):'なし';$('#tabA').classList.toggle('active',S.side==='A');$('#tabB').classList.toggle('active',S.side==='B')}
function pick(id){let pos=S.side==='A'?S.posA:S.posB,q=pos[id];S.selected={side:S.side,id};S.origin={x:q.x,y:q.y};S.side=S.side==='A'?'B':'A';render()}function setSide(x){S.side=x;render()}$('#tabA').onclick=()=>setSide('A');$('#tabB').onclick=()=>setSide('B');$('#generate').onclick=build;$('#optimize').onclick=optimize;$('#exp').onchange=optimize;const view=$('#view');view.scrollLeft=PER;view.scrollTop=PER;let drag=false,sx=0,sy=0,sl=0,st=0;view.onpointerdown=e=>{drag=true;sx=e.clientX;sy=e.clientY;sl=view.scrollLeft;st=view.scrollTop;view.setPointerCapture(e.pointerId)};view.onpointermove=e=>{if(drag){view.scrollLeft=sl-(e.clientX-sx);view.scrollTop=st-(e.clientY-sy)}};view.onpointerup=()=>drag=false;build();
</script></body></html>
